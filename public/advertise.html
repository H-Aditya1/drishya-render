<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Buy ad-space · Drishya</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/advertise.css" />
  </head>
  <body>
    <main>
      <h1>Buy ad-space</h1>
      <section id="confirmation" aria-label="Confirm payment">
        <p id="terms">Loading payment…</p>
        <p id="queue" hidden></p>
        <button id="pay" type="button" disabled>Confirm &amp; pay</button>
      </section>
      <p id="status" role="status" aria-live="polite" hidden></p>
      <button id="retry" type="button" hidden>CHECK PREVIOUS PAYMENT</button>
      <p id="receipt"></p>
      <form id="artwork" hidden>
        <h2>Payment received. Upload two pictures.</h2>
        <label
          >Bathroom picture<input
            id="bathroom"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            required
        /></label>
        <img id="bathroomPreview" alt="Bathroom picture preview" hidden />
        <label
          >Corridor-end picture<input
            id="corridor"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            required
        /></label>
        <img id="corridorPreview" alt="Corridor picture preview" hidden />
        <p class="small">PNG, JPEG or WebP · up to 1 MB each.</p>
        <button id="upload" type="submit">USE THESE TWO PICTURES ↗</button>
      </form>
    </main>
    <script type="module" src="/ads-wallet.js"></script>
  </body>
</html>
